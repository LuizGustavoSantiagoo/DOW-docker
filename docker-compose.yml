services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: luiz-gustavo-de-oliveira-santiago/php:latest
    volumes: 
      - ./:/var/www/html
    working_dir: /var/www/html

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    image: luiz-gustavo-de-oliveira-santiago/nginx:latest
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ca:/etc/nginx/ssl:ro
    depends_on:
      - php

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
